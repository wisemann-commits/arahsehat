    const smartSearch = (query) => {
      if (!query || query.trim().length === 0) return { scenarios: [], glossary: [], articles: [], suggestion: null };

      const cleanQuery = query.toLowerCase().trim();
      const words = cleanQuery.split(/\s+/);

      const intentMap = [
        { keys: ["hak", "pasien", "rekam medis", "rm", "resume", "second opinion", "komplain", "pengaduan", "menolak"], targetId: "hak-pasien-rekam-medis" },
        { keys: ["luar kota", "luar domisili", "mudik", "liburan", "dinas", "pindah sementara", "3 kali", "berobat di luar kota"], targetId: "luar-domisili" },
        { keys: ["ugd", "igd", "gawat darurat", "darurat", "tanpa rujukan", "langsung rs", "sesak nafas", "nyeri dada"], targetId: "gawat-darurat-bpjs" },
        { keys: ["pandawa", "wa bpjs", "whatsapp bpjs", "08118165165", "ubah faskes wa", "rehab", "cicil bpjs"], targetId: "pandawa-layanan" },
        { keys: ["dicover bpjs", "ditanggung bpjs", "operasi bpjs", "gigi bpjs", "psikiater bpjs", "kacamata bpjs", "cuci darah", "tidak dicover"], targetId: "penyakit-cover-bpjs" },
        { keys: ["spesialis", "cek spesialis", "periksa spesialis", "dokter spesialis", "ke spesialis", "spesialis caranya gmn"], targetId: "dokter-spesialis" },
        { keys: ["berobat", "sakit", "periksa", "pusing", "demam", "puskesmas", "klinik", "berobat umum"], targetId: "berobat-umum" },
        { keys: ["rujukan", "surat rujukan", "minta rujukan", "p-care", "cara dapet rujukan", "surat kontrol", "obat kosong", "parsial"], targetId: "butuh-rujukan" },
        { keys: ["lab", "darah", "urin", "laboratorium", "tes darah", "cek gula darah", "kolesterol", "prodia"], targetId: "pemeriksaan-lab" },
        { keys: ["rontgen", "usg", "ct scan", "mri", "radiologi", "foto rontgen"], targetId: "pemeriksaan-radiologi" }
      ];

      let matchedScenarios = NAVIGATION_DATA.filter(item => {
        const titleMatch = item.title.toLowerCase().includes(cleanQuery);
        const keywordMatch = item.keywords && item.keywords.some(k => cleanQuery.includes(k) || k.includes(cleanQuery));
        return titleMatch || keywordMatch;
      });

      intentMap.forEach(intent => {
        if (intent.keys.some(k => cleanQuery.includes(k))) {
          const found = NAVIGATION_DATA.find(n => n.id === intent.targetId);
          if (found && !matchedScenarios.some(m => m.id === found.id)) {
            matchedScenarios.unshift(found);
          }
        }
      });

      let matchedGlossary = GLOSSARY_DATA.filter(g => 
        g.term.toLowerCase().includes(cleanQuery) ||
        g.fullName.toLowerCase().includes(cleanQuery) ||
        (g.keywords && g.keywords.some(k => cleanQuery.includes(k) || k.includes(cleanQuery)))
      );

      let matchedArticles = EDUCATION_ARTICLES.filter(a => 
        a.title.toLowerCase().includes(cleanQuery) ||
        a.summary.toLowerCase().includes(cleanQuery)
      );

      // Smart Suggestion Logic
      let suggestion = null;
      if (cleanQuery.includes("lab") || cleanQuery.includes("darah") || cleanQuery.includes("laborat")) {
        suggestion = "Panduan Pemeriksaan Laboratorium & Tes Darah Mandiri";
      } else if (cleanQuery.includes("spesialis") || cleanQuery.includes("dokter")) {
        suggestion = "Panduan Pendaftaran Dokter Spesialis (BPJS vs Umum)";
      } else if (cleanQuery.includes("rujukan") || cleanQuery.includes("surat")) {
        suggestion = "Panduan Surat Rujukan Online JKN & Surat Kontrol RS";
      } else if (cleanQuery.includes("hak") || cleanQuery.includes("rekam") || cleanQuery.includes("komplain")) {
        suggestion = "Hak-Hak Pasien, Resume Medis & Pengaduan RS";
      } else if (cleanQuery.includes("luar") || cleanQuery.includes("kota")) {
        suggestion = "Panduan Berobat di Luar Domisili / Luar Kota";
      }

      return {
        scenarios: matchedScenarios,
        glossary: matchedGlossary,
        articles: matchedArticles,
        suggestion: suggestion
      };
    };

                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-brand-green hover:text-white text-slate-700 dark:text-slate-200 font-bold transition-all shadow-2xs border border-slate-200/80 dark:border-slate-700"
                    >
                      {link.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                <div className="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-3.5 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>Estimasi Pengakses Platform: <strong>{visitorCount.toLocaleString('id-ID')} Pengunjung Sesi</strong> (Privasi Aman • Tanpa Data Pribadi)</span>
                </div>
                <p>© 2026 ArahSehat Indonesia. Pahami • Temukan • Navigasikan.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function InteractiveScenarioView({ scenario, onBack }) {
      const flowConfig = INTERACTIVE_FLOWS[scenario.id];
      const [answers, setAnswers] = useState({});
      const [showSurveyModal, setShowSurveyModal] = useState(false);
      const [surveySubmitted, setSurveySubmitted] = useState(false);
      const [surveyStatus, setSurveyStatus] = useState(null);

      useEffect(() => {
        setAnswers({});
        setShowSurveyModal(false);
        setSurveySubmitted(false);
        setSurveyStatus(null);
      }, [scenario.id]);

      const handleSelectOption = (qId, val) => {
        setAnswers(prev => ({ ...prev, [qId]: val }));
      };

      const result = useMemo(() => {
        if (!flowConfig) return null;
        return flowConfig.getResult(answers);
      }, [flowConfig, answers]);

      const handleBackClick = () => {
        setShowSurveyModal(true);
      };

      const handleSurveySubmit = async (isHelpful) => {
        const statusVal = isHelpful ? 'helpful' : 'unhelpful';
        setSurveyStatus(statusVal);
        setSurveySubmitted(true);

        const payload = {
          timestamp: new Date().toISOString(),
          scenarioId: scenario.id,
          scenarioTitle: scenario.title,
          isHelpful: isHelpful,
          preComprehensionRate: "Rendah (Sebelum Membaca)",
          postComprehensionRate: isHelpful ? "Tinggi (Sangat Paham)" : "Perlu Penjelasan Lebih",
          userAnswers: answers
        };

        if (GAS_SURVEY_URL && GAS_SURVEY_URL.trim() !== "") {
          try {
            await fetch(GAS_SURVEY_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
          } catch (err) {
            console.warn("Gagal mengirim data survei ke GAS:", err);
          }
        } else {
          console.log("[GAS Survey Logged Locally - GAS_SURVEY_URL belum diisi]:", payload);
        }

        setTimeout(() => {
          setShowSurveyModal(false);
          onBack();
        }, 1600);
      };

      const handleSkipSurvey = () => {
        setShowSurveyModal(false);
        onBack();
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          <button
            onClick={handleBackClick}
            className="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-brand-green transition-colors"
          >
            <Icon name="arrow-left" className="w-4 h-4" />
            <span>Kembali ke Daftar Skenario Navigasi</span>
          </button>

          <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-xs space-y-4">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold uppercase">
              <Icon name="compass" className="w-3.5 h-3.5" />
              <span>{scenario.category}</span>
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">
              {scenario.title}
            </h1>
            <p className="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed">
              {scenario.introduction}
            </p>
          </div>

          {flowConfig ? (
            <div className="bg-emerald-50/80 dark:bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-emerald-200 dark:border-emerald-900 space-y-6 shadow-xs">
              <div className="space-y-1">
                <span className="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                  <Icon name="help-circle" className="w-4 h-4" />
                  <span>Tanya-Jawab Interaktif Kebutuhan Anda</span>
                </span>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                  {flowConfig.description}
                </h3>
              </div>

              <div className="space-y-6">
                {flowConfig.questions.map((q) => {
                  if (q.condition && !q.condition(answers)) return null;
                  return (
                    <div key={q.id} className="space-y-3 bg-white dark:bg-slate-900 p-5 rounded-2xl border border-emerald-100 dark:border-slate-700">
                      <h4 className="font-semibold text-sm sm:text-base text-slate-800 dark:text-slate-100">
                        {q.question}
                      </h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        {q.options.map((opt) => {
                          const isSelected = answers[q.id] === opt.value;
                          return (
                            <button
                              key={opt.value}
                              onClick={() => handleSelectOption(q.id, opt.value)}
                              className={`p-3.5 text-left text-xs sm:text-sm font-medium rounded-xl border transition-all flex items-center justify-between ${
                                isSelected
                                  ? 'bg-brand-green text-white border-brand-green font-bold shadow-xs'
                                  : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-emerald-400'
                              }`}
                            >
                              <div className="flex items-center gap-2">
                                <Icon name={opt.icon || 'circle'} className="w-4 h-4" />
                                <span>{opt.label}</span>
                              </div>
                              {isSelected && <Icon name="check-circle-2" className="w-4 h-4 ml-2" />}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : null}

          {result && (
            <div className="space-y-6 animate-fadeIn">
              <div className="flex items-center justify-between">
                <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <Icon name="list-checks" className="w-6 h-6 text-brand-green" />
                  <span>Alur Langkah Tepat Sesuai Pilihan Anda</span>
                </h2>
                <span className="text-xs text-slate-500 font-semibold">{result.steps.length} Langkah Utama</span>
              </div>

              <div className="space-y-4">
                {result.steps.map((step, idx) => (
                  <div key={idx} className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-xs flex items-start gap-4 hover:border-emerald-500/50 transition-colors">
                    <div className="w-9 h-9 rounded-full bg-brand-green text-white font-extrabold text-sm flex items-center justify-center flex-shrink-0 mt-0.5 shadow-xs">
                      {idx + 1}
                    </div>
                    <div className="space-y-1.5 flex-1">
                      <h3 className="font-bold text-slate-800 dark:text-white text-base sm:text-lg">
                        {step.title}
                      </h3>
                      <p className="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed">
                        {step.desc}
                      </p>
                    </div>
                  </div>
                ))}
              </div>

              {result.notes && result.notes.length > 0 && (
                <div className="bg-amber-50 dark:bg-amber-950/40 rounded-2xl p-6 border border-amber-200 dark:border-amber-900/60 space-y-2">
                  <h3 className="font-bold text-amber-900 dark:text-amber-200 text-sm flex items-center gap-2">
                    <Icon name="alert-circle" className="w-4 h-4 text-amber-600" />
                    <span>Catatan Penting Pelayanan</span>
                  </h3>
                  <ul className="list-disc list-inside text-xs sm:text-sm text-amber-800 dark:text-amber-300 space-y-1.5 leading-relaxed">
                    {result.notes.map((note, nIdx) => (
                      <li key={nIdx}>{note}</li>
                    ))}
                  </ul>
                </div>
              )}

              <div className="pt-4 flex flex-wrap items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800">
                <div className="flex items-center gap-2">
                  <Icon name="shield-check" className="w-4 h-4 text-emerald-600" />
                  <span>Sumber Resmi Terverifikasi: {result.sources.map(s => s.name).join(', ')}</span>
                </div>
                <a 
                  href={result.sources[0]?.url || "https://kemkes.go.id"} 
                  target="_blank" 
                  rel="noreferrer"
                  className="text-brand-green font-bold hover:underline flex items-center gap-1"
                >
                  <span>Verifikasi Portal Resmi</span>
                  <Icon name="external-link" className="w-3.5 h-3.5" />
                </a>
              </div>
            </div>
          )}

          {/* ANONYMOUS SURVEY MODAL ON KEMBALI (FIXED CENTERED OVERLAY - ZERO SCROLL NEEDED) */}
          {showSurveyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md animate-fadeIn overflow-y-auto">
              <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-2xl space-y-4 relative my-auto">
                <button 
                  onClick={handleSkipSurvey}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-full transition-colors"
                  aria-label="Tutup"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                {!surveySubmitted ? (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 mx-auto rounded-full bg-emerald-100 dark:bg-emerald-950 text-brand-green flex items-center justify-center">
                      <Icon name="heart-handshake" className="w-6 h-6" />
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">
                        Survei Kepahaman Anonim
                      </span>
                      <h3 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white">
                        Apakah Informasi Ini Membantu Anda?
                      </h3>
                      <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                        Pilihan Anda membantu mengukur tingkat kepahaman masyarakat secara anonim tanpa data pribadi.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                      <button
                        onClick={() => handleSurveySubmit(true)}
                        className="p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 border-2 border-emerald-300 dark:border-emerald-700 hover:border-brand-green text-slate-800 dark:text-slate-100 font-bold text-xs sm:text-sm flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 shadow-xs"
                      >
                        <span className="text-2xl">👍</span>
                        <span>Membantu (Saya Jadi Paham)</span>
                      </button>

                      <button
                        onClick={() => handleSurveySubmit(false)}
                        className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 hover:border-slate-400 text-slate-700 dark:text-slate-300 font-bold text-xs sm:text-sm flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 shadow-xs"
                      >
                        <span className="text-2xl">👎</span>
                        <span>Belum Membantu / Bingung</span>
                      </button>
                    </div>

                    <div className="pt-1">
                      <button
                        onClick={handleSkipSurvey}
                        className="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 underline font-medium"
                      >
                        Lewati survei & langsung kembali
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-center py-3 animate-fadeIn">
                    <div className="w-14 h-14 mx-auto rounded-full bg-emerald-100 dark:bg-emerald-950 text-brand-green flex items-center justify-center">
                      <Icon name="check-circle" className="w-8 h-8" />
                    </div>
                    <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">
                      Terima Kasih Banyak!
                    </h3>
                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed max-w-xs mx-auto">
                      Masukan Anda membantu kami memastikan informasi kesehatan ArahSehat selalu mudah dipahami oleh seluruh masyarakat Indonesia.
                    </p>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
